name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: src/lambda-python-s3-trigger
        run: |
          if [ -f requirements.txt ] && [ -s requirements.txt ]; then
            pip install -r requirements.txt
          fi
      
      - name: Run Flake8
        run: |
          pip install flake8
          flake8 . || true

  python-security:
    name: Python Security
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: src/lambda-python-s3-trigger
        run: |
          if [ -f requirements.txt ] && [ -s requirements.txt ]; then
            pip install -r requirements.txt
          fi
      
      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r . || true

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: src/lambda-python-s3-trigger
        run: |
          if [ -f requirements.txt ] && [ -s requirements.txt ]; then
            pip install -r requirements.txt
          fi
      
      - name: Install test dependencies
        if: ${{ hashFiles('tests/**') != '' }}
        run: pip install pytest pytest-cov
      
      - name: Run tests
        if: ${{ hashFiles('tests/**') != '' }}
        run: pytest tests/ --cov=. --cov-report=xml --cov-report=html || true
      
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7

  terraform-security:
    name: Terraform Security
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Checkov
        run: |
          pip install checkov
          checkov -d . || true

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~1.1
      
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: Configure Terraform Cloud
        working-directory: iac/terraform
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
        run: |
          if [ -n "$TFC_TOKEN" ]; then
            cat > $HOME/.terraformrc << EOF
          credentials "app.terraform.io" {
            token = "$TFC_TOKEN"
          }
          EOF
          fi
      
      - name: Terraform Init
        working-directory: iac/terraform
        run: terraform init -backend=false
      
      - name: Terraform Validate
        working-directory: iac/terraform
        run: terraform validate
      
      - name: Terraform Format
        working-directory: iac/terraform
        run: terraform fmt

  terraform-deploy:
    name: Build Lambda and Deploy Terraform
    needs: [python-lint, python-security, python-test, terraform-security, terraform-validate]
    runs-on: ubuntu-latest
    environment: production
    if: always()
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install Python dependencies
        working-directory: src/lambda-python-s3-trigger
        run: |
          if [ -f requirements.txt ] && [ -s requirements.txt ]; then
            pip install -r requirements.txt
          fi
      
      - name: Build Lambda package for Terraform
        run: |
          mkdir -p ./iac/terraform
          cd src/lambda-python-s3-trigger
          zip -r ../../iac/terraform/lambda_function.zip . -x "*.git*" "*.md" "tests/*" "*.tf*" "iac/**"
          cd ../..
          echo "✓ Lambda package built at: ./iac/terraform/lambda_function.zip"
          ls -lh ./iac/terraform/lambda_function.zip
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~1.1
      
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: Configure Terraform Cloud
        working-directory: iac/terraform
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
        run: |
          if [ -n "$TFC_TOKEN" ]; then
            cat > $HOME/.terraformrc << EOF
          credentials "app.terraform.io" {
            token = "$TFC_TOKEN"
          }
          EOF
          fi
      
      - name: Verify Lambda package exists
        run: |
          TERRAFORM_LAMBDA_PATH="./iac/terraform/lambda_function.zip"
          if [ ! -f "$TERRAFORM_LAMBDA_PATH" ]; then
            echo "Error: Lambda package not found at: $TERRAFORM_LAMBDA_PATH"
            exit 1
          fi
          echo "✓ Lambda package verified at: $TERRAFORM_LAMBDA_PATH"
          ls -lh "$TERRAFORM_LAMBDA_PATH"
      
      - name: Terraform Init
        working-directory: iac/terraform
        run: terraform init
      
      - name: Terraform Plan
        id: terraform-plan
        working-directory: iac/terraform
        run: terraform plan -out=tfplan
        continue-on-error: true
      
      - name: Terraform Apply
        working-directory: iac/terraform
        run: |
          if [ "${{ steps.terraform-plan.outcome }}" == "success" ]; then
            terraform apply tfplan
          else
            terraform apply -auto-approve
          fi
